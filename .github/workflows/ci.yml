name: CI
on:
  push:
    branches: [main]   # a pull request is tested by its own run, so a pushed branch is not tested twice
  pull_request:
  release:
    types: [published]   # the AppImage is only built here (and by hand), not on every change
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}   # a newer push to a branch or pull request replaces its older run; main always finishes

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --shm-size=1g   # Chromium shares big messages through /dev/shm; Docker's default 64 MB is far below any desktop's
    steps:
      - name: Install packages
        run: |
          pacman -Syu --noconfirm --needed git nodejs npm electron fontconfig ttf-dejavu nss alsa-lib gtk3 libxss libxtst at-spi2-core libdrm mesa
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Trust the checkout (the container runs as a different user)
        run: git config --global --add safe.directory "$PWD"
      - name: Shell syntax
        run: bash -n install.sh && bash -n uninstall.sh && bash -n make-release.sh && bash -n packaging/install-mac.sh
      - name: Dependencies
        run: npm ci --no-audit --no-fund && node node_modules/electron/install.js
      - name: Types, lint, unused code and the budget
        run: npm run check:fast
      - name: Build
        run: npm run build
      - name: Theme test (every colour theme's contrast, and card colours that stay apart for colour blindness)
        run: node tests/themes.ts
      - name: Vault test (reading notes, privacy rules)
        run: node tests/vault.ts
      - name: Code map test (imports, cycles, descriptions, the lookup command)
        run: node tests/codemap.ts
      - name: Save test (running-only flags stay out of board files)
        run: node tests/persist.ts
      - name: Model test (board and library files, prototype fields)
        run: node tests/model.ts
      - name: Context bar placement test (above, flipped, stuck and beside a line, without the app)
        run: node tests/barPlace.ts
      - name: Rich text test (the note dialect, its markup, and round trips)
        run: node tests/richtext.ts
      - name: Rich paste test (HTML, Markdown and PDF clipboards into notes)
        run: node tests/richpaste.ts
      - name: Rich notes test (pasted formatting kept through redraw, save and reopen, in the real app)
        run: node tests/richNotes.ts
      - name: Rich typing test (shortcuts, lists by hand, list keys and the selection bar, in the real app)
        run: node tests/richTyping.ts
      - name: Rich integration test (Myra, the clipboard, tags, collection heights and the Workshop starter with rich notes, in the real app)
        run: node tests/richIntegration.ts
      - name: Rich links test (links and typed Markdown in notes, in the real app)
        run: node tests/richLinks.ts
      - name: Rich access test (rich notes with a keyboard and a screen reader, in the real app)
        run: node tests/richAccess.ts
      - name: Rich docs test (a rich note dropped into a Doc keeps its formatting, in the real app)
        run: node tests/richDocs.ts
      - name: Placement test (moving and copying boards and folders with prototypes)
        run: node tests/placement.ts
      - name: Fit test (how a prototype board's columns fold)
        run: node tests/fit.ts
      - name: Git test (the git and gh bridge, with real git and a stand-in gh)
        run: node tests/git.ts
      - name: Link test (a project's repo, from its menu)
        run: node tests/link.ts
      - name: Setup test (git and GitHub in Settings, with a stand-in gh)
        run: node tests/setup.ts
      - name: GitHub test (a project's GitHub repo, with a stand-in gh)
        run: node tests/github.ts
      - name: Prototype test (prototyping folders and new prototypes in a linked repo)
        run: node tests/prototype.ts
      - name: Layout test (a prototype board's screen)
        run: node tests/layout.ts
      - name: Prototype chat test (Myra's chat docked on a prototype board)
        run: node tests/protoChat.ts
      - name: Preview test (a prototype running in its sandbox)
        run: node tests/preview.ts
      - name: Build test (Myra writing a prototype's code, with a stand-in Claude Code)
        run: node tests/build.ts
      - name: Build buttons test (Myra's stored Commit and Undo across builds and boards)
        run: node tests/buildButtons.ts
      - name: Packages test (installed packages in a prototype, with a stand-in npm)
        run: node tests/packages.ts
      - name: Sync test (fetch, pull and clashes with a stand-in GitHub)
        run: node tests/sync.ts
      - name: Controls test (a prototype's knobs above the preview)
        run: node tests/controls.ts
      - name: Done test (link, prototype, build, point, commit, push, reopen)
        run: node tests/done.ts
      - name: Myra reply test
        run: node tests/reply.ts
      - name: Change record test (what a reply changed, sorted into added, moved, edited, removed and re-laid)
        run: node tests/changes.ts
      - name: Myra replies test (what each kind of reply does to the board, her chat, the library and templates)
        run: node tests/replies.ts
      - name: Reply undo test (one undo step per reply, replies in turn, previews that change nothing)
        run: node tests/replyUndo.ts
      - name: Chat buttons test (Myra's next steps, sources and build buttons, kept with her replies)
        run: node tests/chatButtons.ts
      - name: Reply acts test (Changed on the board, Show on board and Undo under a reply, in the chat and her bubble)
        run: node tests/replyActs.ts
      - name: Reply sources test (what Myra read as links and her next steps under a reply, kept across reopen and restart)
        run: node tests/replySources.ts
      - name: Chat keys test (what each key does in Myra's chat input)
        run: node tests/chatKeys.ts
      - name: Chat rules test (her input's hint and her name cut short)
        run: node tests/chatRules.ts
      - name: Chat starters test (what an empty chat offers to ask, for each kind of board)
        run: node tests/chatStarters.ts
      - name: Chat greeting test (her hello by her given name, and starters from the board)
        run: node tests/chatGreeting.ts
      - name: Chat sees test (the "Myra sees" chips, what each message is sent with, and the header's status line)
        run: node tests/chatSees.ts
      - name: Chat add test (pictures, files and vault notes added to one message, and their limits)
        run: node tests/chatAdd.ts
      - name: Mac font list test
        run: node tests/mac.ts
      - name: Smoke test (the real app, with stand-in claude and whisper)
        run: node tests/smoke.ts
      - name: Zoom test
        run: node tests/zoom.ts
      - name: Docs editor test
        run: node tests/docs.ts
      - name: Phone layout test
        run: node tests/phone.ts
      - name: Popup test
        run: node tests/popups.ts
      - name: Selection bar test (what it kept, where it floats, and that it steps aside for gestures)
        run: node tests/contextBar.ts
      - name: Selection bar groups test (which groups and buttons it shows for every kind of card, a connector and cropping)
        run: node tests/barGroups.ts
      - name: Selection bar keyboard test (F10 in, Space and Enter, Escape out, names after a hover, clicks leave keys to the board)
        run: node tests/barKeyboard.ts
      - name: Selection bar room test (dropdowns near the top, presses on the bar, a 900 px window)
        run: node tests/barRoom.ts
      - name: Drawing and find test (what they do, on a computer and a phone)
        run: node tests/modeBar.ts
      - name: Mode bar room test (Myra's chat, her timer and the toolbar's pickers keep clear of find's bar)
        run: node tests/modeRoom.ts
      - name: Bottom bar test (where it sits, what hides it, drops and the wheel on it, Tab order, a phone's strips)
        run: node tests/bottomBar.ts
      - name: Bar layer test (what opens over the bottom bar and Myra's chat)
        run: node tests/barLayer.ts
      - name: Myra's box test (her box in the bottom bar, where her chat opens, her bubble, fitting around the chat)
        run: node tests/myraBox.ts
      - name: Chat close test (what opens and closes Myra's chat, focus, its resize and the draft line)
        run: node tests/chatClose.ts
      - name: Chat Expand test (the writing area keeps the draft and caret, Esc shrinks before it closes, and a send, a close or a board switch shrinks it)
        run: node tests/chatExpand.ts
      - name: Chat draft test (an unsent message survives closing the chat, switching boards and a restart, follows Keep chats, and goes with a deleted board)
        run: node tests/chatDraft.ts
      - name: Chat draft leftovers test (a deleted board leaves no draft, Clear all chats reaches prototype boards, and Keep chats takes drafts out of files)
        run: node tests/chatDraftKept.ts
      - name: Chat paste test (a paste over 2,000 characters is a chip whose full text reaches Myra, with Open, Ctrl+Shift+V and its limits)
        run: node tests/chatPaste.ts
      - name: Quick capture test (Enter saves to Unsorted, Shift+Enter writes it out on the board first)
        run: node tests/capture.ts
      - name: Image actions test (download, copy and replace a picture, in the real app)
        run: node tests/imageActions.ts
      - name: Updater test
        run: node tests/update.ts
      - name: Caelestia theme test
        run: node tests/theme.ts
      - name: Install from a fresh clone, run the installed copy, uninstall
        run: |
          # each part's output goes to a file; on failure its last lines become annotations, so they're readable without the full log
          report() { echo "::error title=$1::$(tail -c 3000 "$2" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"; exit 1; }
          useradd -m tester && git clone -q . /home/tester/fenmyr && chown -R tester /home/tester/fenmyr
          su tester -c 'cd ~/fenmyr && ./install.sh --yes --no-open' > install.log 2>&1 || report install install.log
          cat /home/tester/.local/lib/fenmyr/app/install.json; echo "::notice title=Arch electron::$(pacman -Q $(pacman -Qq | grep -E "^electron[0-9]+$") 2>&1 | tr "\n" " ")"
          su tester -c "cd ~/fenmyr && npm ci --ignore-scripts --no-audit --no-fund && FENMYR_APP=\$HOME/.local/lib/fenmyr/app node tests/smoke.ts" > smoke.log 2>&1 || report installed-smoke smoke.log
          su tester -c 'cd ~/fenmyr && ./uninstall.sh --purge' > uninstall.log 2>&1 || report uninstall uninstall.log
          test ! -e /home/tester/.local/bin/fenmyr
      # last, so a deliberate pixel change still lets every other check run; it fails the job all the same.
      # A pull request is compared with the branch it merges into, so one into a feature branch lists only its own changes.
      - name: Visual check against the base branch
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: VISUAL_OUT=/tmp/visual node tools/visual-diff.ts "origin/$BASE"
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: visual-diff
          path: /tmp/visual
      - name: Build the AppImage
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: npx electron-builder --linux AppImage --x64 --publish never
      - uses: actions/upload-artifact@v5
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          name: Fenmyr-x86_64.AppImage
          path: build/release/*.AppImage
