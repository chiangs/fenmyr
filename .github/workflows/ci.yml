name: CI
on:
  push:
    branches: [main]   # a pull request is tested by its own run, so a pushed branch is not tested twice
  pull_request:
  release:
    types: [published]   # the AppImage is only built here (and by hand), not on every change
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}   # a newer push to a branch or pull request replaces its older run; main always finishes

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --shm-size=1g   # Chromium shares big messages through /dev/shm; Docker's default 64 MB is far below any desktop's
    steps:
      - name: Install packages
        run: |
          pacman -Syu --noconfirm --needed git nodejs npm electron fontconfig ttf-dejavu nss alsa-lib gtk3 libxss libxtst at-spi2-core libdrm mesa
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Trust the checkout (the container runs as a different user)
        run: git config --global --add safe.directory "$PWD"
      - name: Shell syntax
        run: bash -n install.sh && bash -n uninstall.sh && bash -n make-release.sh
      - name: Dependencies
        run: npm ci --no-audit --no-fund && node node_modules/electron/install.js
      - name: Types, lint, unused code and the budget
        run: npm run check:fast
      - name: Build
        run: npm run build
      - name: Vault test (reading notes, privacy rules)
        run: node tests/vault.ts
      - name: Save test (running-only flags stay out of board files)
        run: node tests/persist.ts
      - name: Model test (board and library files, prototype fields)
        run: node tests/model.ts
      - name: Rich text test (the note dialect, its markup, and round trips)
        run: node tests/richtext.ts
      - name: Rich paste test (HTML, Markdown and PDF clipboards into notes)
        run: node tests/richpaste.ts
      - name: Rich notes test (pasted formatting kept through redraw, save and reopen, in the real app)
        run: node tests/richNotes.ts
      - name: Rich typing test (shortcuts, lists by hand, list keys and the selection bar, in the real app)
        run: node tests/richTyping.ts
      - name: Placement test (moving and copying boards and folders with prototypes)
        run: node tests/placement.ts
      - name: Fit test (how a prototype board's columns fold)
        run: node tests/fit.ts
      - name: Git test (the git and gh bridge, with real git and a stand-in gh)
        run: node tests/git.ts
      - name: Link test (a project's repo, from its menu)
        run: node tests/link.ts
      - name: Setup test (git and GitHub in Settings, with a stand-in gh)
        run: node tests/setup.ts
      - name: GitHub test (a project's GitHub repo, with a stand-in gh)
        run: node tests/github.ts
      - name: Prototype test (prototyping folders and new prototypes in a linked repo)
        run: node tests/prototype.ts
      - name: Layout test (a prototype board's screen)
        run: node tests/layout.ts
      - name: Preview test (a prototype running in its sandbox)
        run: node tests/preview.ts
      - name: Build test (Myra writing a prototype's code, with a stand-in Claude Code)
        run: node tests/build.ts
      - name: Packages test (installed packages in a prototype, with a stand-in npm)
        run: node tests/packages.ts
      - name: Sync test (fetch, pull and clashes with a stand-in GitHub)
        run: node tests/sync.ts
      - name: Controls test (a prototype's knobs above the preview)
        run: node tests/controls.ts
      - name: Done test (link, prototype, build, point, commit, push, reopen)
        run: node tests/done.ts
      - name: Myra reply test
        run: node tests/reply.ts
      - name: Mac font list test
        run: node tests/mac.ts
      - name: Smoke test (the real app, with stand-in claude and whisper)
        run: node tests/smoke.ts
      - name: Zoom test
        run: node tests/zoom.ts
      - name: Docs editor test
        run: node tests/docs.ts
      - name: Phone layout test
        run: node tests/phone.ts
      - name: Popup test
        run: node tests/popups.ts
      - name: Updater test
        run: node tests/update.ts
      - name: Caelestia theme test
        run: node tests/theme.ts
      - name: Install from a fresh clone, run the installed copy, uninstall
        run: |
          # each part's output goes to a file; on failure its last lines become annotations, so they're readable without the full log
          report() { echo "::error title=$1::$(tail -c 3000 "$2" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"; exit 1; }
          useradd -m tester && git clone -q . /home/tester/fenmyr && chown -R tester /home/tester/fenmyr
          su tester -c 'cd ~/fenmyr && ./install.sh --yes --no-open' > install.log 2>&1 || report install install.log
          cat /home/tester/.local/lib/fenmyr/app/install.json; echo "::notice title=Arch electron::$(pacman -Q $(pacman -Qq | grep -E "^electron[0-9]+$") 2>&1 | tr "\n" " ")"
          su tester -c "cd ~/fenmyr && npm ci --ignore-scripts --no-audit --no-fund && FENMYR_APP=\$HOME/.local/lib/fenmyr/app node tests/smoke.ts" > smoke.log 2>&1 || report installed-smoke smoke.log
          su tester -c 'cd ~/fenmyr && ./uninstall.sh --purge' > uninstall.log 2>&1 || report uninstall uninstall.log
          test ! -e /home/tester/.local/bin/fenmyr
      # last, so a deliberate pixel change still lets every other check run; it fails the job all the same
      - name: Visual check against main
        run: VISUAL_OUT=/tmp/visual node tools/visual-diff.ts origin/main
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: visual-diff
          path: /tmp/visual
      - name: Build the AppImage
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: npx electron-builder --linux AppImage --x64 --publish never
      - uses: actions/upload-artifact@v5
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          name: Fenmyr-x86_64.AppImage
          path: build/release/*.AppImage
